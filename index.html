<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MIHC 2026 筹备工作台</title>
<style>
:root{
  --bg:#f3f5f1; --panel:#ffffff; --ink:#18231d; --muted:#5c6a62; --line:#dde3dc;
  --accent:#1f6f54; --accent-soft:#e1efe8; --on-accent:#ffffff;
  --red:#c2412d; --red-soft:#fbe7e2; --amber:#b7791f; --amber-soft:#fbf0dc;
  --green:#2e8a4f; --green-soft:#e2f3e7; --blue:#2f5f9e; --blue-soft:#e3ecf8;
  --chip:#eef1ec;
  --sans:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC","Songti SC",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111713; --panel:#18201b; --ink:#e6ece7; --muted:#9aa89f; --line:#2a352e;
  --accent:#5cc49b; --accent-soft:#1d3129; --on-accent:#0d1a14;
  --red:#ef7a64; --red-soft:#3a201b; --amber:#e3ad55; --amber-soft:#35291a;
  --green:#6bc98b; --green-soft:#1b3123; --blue:#8bb2ea; --blue-soft:#1c2738; --chip:#222c25;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111713; --panel:#18201b; --ink:#e6ece7; --muted:#9aa89f; --line:#2a352e;
  --accent:#5cc49b; --accent-soft:#1d3129; --on-accent:#0d1a14;
  --red:#ef7a64; --red-soft:#3a201b; --amber:#e3ad55; --amber-soft:#35291a;
  --green:#6bc98b; --green-soft:#1b3123; --blue:#8bb2ea; --blue-soft:#1c2738; --chip:#222c25;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:900;letter-spacing:.02em}
h2{font-size:18px;font-weight:600}
h3{font-size:14px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
.meta{color:var(--muted);font-size:13px}
.countdowns{display:flex;gap:10px;flex-wrap:wrap}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:112px}
.cd b{display:block;font-family:var(--mono);font-size:24px;line-height:1.1}
.cd.hot b{color:var(--red)}
.cd span{font-size:12px;color:var(--muted)}
/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{flex:0 0 auto;background:none;border:1px solid transparent;border-radius:6px;padding:6px 14px;font:inherit;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
nav.tabs button b{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--chip);border-radius:999px;padding:0 6px;color:var(--muted)}
nav.tabs button b.warn{background:var(--red-soft);color:var(--red)}
nav.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
nav.tabs button[aria-selected=true] b{background:var(--bg);color:var(--ink)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.hint{font-size:12px;color:var(--muted)}
.panel{display:flex;flex-direction:column;gap:22px}
/* cards & stats */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kpi .big{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
.kpi .big small{font-size:13px;color:var(--muted);font-weight:500}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.warn .big{color:var(--red)}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.stream{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stream:hover{border-color:var(--accent)}
.stream .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stream .pct{font-family:var(--mono);font-size:22px;font-weight:600}
.stream ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--muted)}
.stream ul li.r{color:var(--red)}
/* stage funnel */
.funnel{display:flex;flex-direction:column;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.frow{display:grid;grid-template-columns:80px 1fr 118px;gap:10px;align-items:center;font-size:13px}
.frow .track{height:12px;background:var(--chip);border-radius:3px;overflow:hidden}
.frow .track i{display:block;height:100%;background:var(--accent)}
.frow .v{font-family:var(--mono);text-align:right;font-size:12.5px}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text],input[type=date]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
button{font:inherit;cursor:pointer}
.chipbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px}
.chipbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* lists */
.group{display:flex;flex-direction:column;gap:6px}
.group>h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.group>h3 .n{font-family:var(--mono);color:var(--muted);font-weight:500;font-size:12px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:9px 12px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.item.flag{box-shadow:inset 3px 0 0 var(--red)}
.item .lead{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;padding-top:2px}
.item .ttl{font-weight:500}
.item .sub{font-size:12.5px;color:var(--muted)}
.item .right{text-align:right;font-size:12.5px;white-space:nowrap}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12px;color:var(--muted);align-items:center}
.tag{background:var(--chip);border-radius:4px;padding:0 6px;font-size:12px}
.tag.own{background:var(--accent-soft);color:var(--accent);font-weight:500}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.stages{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sg{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:4px;padding:1px 8px;font-size:12px}
.sg.on{background:var(--green-soft);border-color:transparent;color:var(--green)}
.sg.on::before{content:"✓ "}
.sg:disabled{cursor:default}
.note{font-size:12.5px;color:var(--muted);cursor:text;border-bottom:1px dashed transparent}
.note:hover{border-bottom-color:var(--line)}
.note.empty{opacity:.6}
.warnline{font-size:12.5px;color:var(--red)}
.late{color:var(--red);font-weight:600}
.today{color:var(--amber);font-weight:600}
.pill{border:0;border-radius:4px;padding:2px 10px;font-size:12px;white-space:nowrap}
.pill.s0{background:var(--chip);color:var(--muted)}
.pill.s1{background:var(--blue-soft);color:var(--blue)}
.pill.s2{background:var(--red-soft);color:var(--red);font-weight:700}
.pill.s3{background:var(--green-soft);color:var(--green)}
/* tables */
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px;border-top:0;background:var(--chip)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td .mini{display:inline-block;width:80px;height:6px;background:var(--chip);border-radius:3px;vertical-align:middle;overflow:hidden;margin-left:6px}
td .mini i{display:block;height:100%;background:var(--accent)}
/* modules */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.mod{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px;padding:9px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.mod.red{border-left-color:var(--red)}.mod.yellow{border-left-color:var(--amber)}.mod.green{border-left-color:var(--green)}
.mod .code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mod .nm{font-weight:700}.mod .ow{font-size:12px;color:var(--muted)}
.mod .sm{grid-column:1/-1;font-size:12.5px;margin-top:3px}
.light{grid-row:1/3;grid-column:2;align-self:start;border:0;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink)}
.light.red{background:var(--red-soft);color:var(--red)}.light.yellow{background:var(--amber-soft);color:var(--amber)}.light.green{background:var(--green-soft);color:var(--green)}
/* activity cards */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.act .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.act .nm{font-weight:700;font-size:15px}
.act .risk{font-size:12.5px;color:var(--red)}
.addform{display:flex;flex-wrap:wrap;gap:8px;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:10px}
.addform input[type=text]{flex:1 1 220px}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:5px 16px}
.del{background:none;border:0;color:var(--muted);font-size:12px;padding:0}
.banner{background:var(--amber-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}.item{grid-template-columns:1fr}.item .right{text-align:left}.item .lead{min-width:0}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.gate form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.gate h2{font-size:20px}.gate input{font-size:16px;padding:9px 10px}
.gate .err{color:var(--red);font-size:13px;min-height:18px}
.lockbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 10px;font-size:12px}
.ai-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:11px 18px;font:inherit;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center}
.ai-fab b{font-family:var(--mono);font-size:11px;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:0 5px}
.ai-panel{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ai-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ai-head h2{font-size:16px}
.ai-x{background:none;border:0;font-size:20px;color:var(--muted);line-height:1;padding:4px 8px}
.ai-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:92%;padding:9px 12px;border-radius:10px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ai-msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.ai-msg.a{align-self:flex-start;background:var(--chip);color:var(--ink)}
.ai-msg.a.wait{color:var(--muted)}
.ai-msg.err{background:var(--red-soft);color:var(--red)}
.ai-chips{display:flex;flex-wrap:wrap;gap:6px}
.ai-chips button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink);text-align:left}
.ai-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ai-row{display:flex;gap:8px}
.ai-row textarea{flex:1;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:none;min-height:44px;max-height:120px}
.ai-note{font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>


<div class="gate" id="gate"><form id="gateForm" autocomplete="off">
  <div class="eyebrow">MIHC 2026 · 内部工作台</div><h2>请输入访问密码</h2>
  <input type="password" id="gatePw" placeholder="访问密码" aria-label="访问密码" required>
  <div class="err" id="gateErr"></div>
  <button class="primary" type="submit" style="padding:9px">进入工作台</button>
  <div class="hint">密码向会议统筹方园获取；本浏览器 7 天内免重复输入</div><div class="hint">内容已加密，只有输入正确密码后才会在本机解密显示</div></form></div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <div class="eyebrow">MIHC 2026 · 绍兴温德姆 · 10/12–10/14</div>
      <h1>MIHC 2026 筹备工作台</h1>
      <div class="meta">数据基准：<span id="srcInfo">一张表</span> · 网页生成于 <span id="built"></span> · 勾选与备注仅保存在本机浏览器 <button class="lockbtn" id="clearLocal" type="button">清除本机记录</button> <button class="lockbtn" id="lockBtn" type="button">锁定</button></div>
    </div>
    <div class="countdowns">
      <div class="cd hot"><b id="cdOrder">–</b><span>天 · 9/30 节前下单</span></div>
      <div class="cd"><b id="cdBuild">–</b><span>天 · 10/11 进场彩排</span></div>
      <div class="cd"><b id="cdOpen">–</b><span>天 · 10/12 开幕</span></div>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view" class="panel"></main>
</div>
<button class="ai-fab" id="aiFab" type="button" hidden>查进展</button>
<aside class="ai-panel" id="aiPanel" hidden aria-label="进展查询">
  <div class="ai-head"><h2>进展查询</h2><button class="ai-x" id="aiClose" type="button" aria-label="关闭">×</button></div>
  <div class="ai-foot" style="border-top:0;border-bottom:1px solid var(--line)">
    <div class="ai-row"><input type="text" id="aiInput" placeholder="输入姓名或关键词，如：韩泽坤、晨跑、鉴湖厅1" style="flex:1;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"><button class="primary" id="aiSend" type="button">查询</button></div>
    <div class="ai-note">点姓名直接查看此人名下全部事项（数字 = 未完成数）</div>
    <div class="ai-chips" id="qChips"></div>
  </div>
  <div class="ai-log" id="qOut"></div>
</aside>


<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayStr=()=>new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
const daysTo=s=>Math.round((Date.parse(s)-Date.parse(todayStr()))/864e5);
const md=s=>s&&/^\d{4}-/.test(s)?s.slice(5).replace("-","/"):(s||"");
const pct=(a,b)=>b?Math.round(a/b*100):0;
const STREAMS=["agenda","materials","media","meals","hotel","invites"];
const USERF=["note","setup"];
const COLS=["tasks","modules","activities","snaps",...STREAMS.map(c=>"ov_"+c)];
const D={}; ["tasks","modules","activities","meta",...STREAMS].forEach(c=>D[c]=[]);
const RAW={}; COLS.forEach(c=>RAW[c]=[]);
let SNAP_TS=0;
function setPath(o,path,v){const ks=path.split(".");let t=o;for(let i=0;i<ks.length-1;i++){t[ks[i]]={...(t[ks[i]]||{})};t=t[ks[i]];}t[ks[ks.length-1]]=v;}
function rebuild(){
  ["tasks","modules","activities"].forEach(c=>D[c]=RAW[c]);
  const by={}; RAW.snaps.forEach(d=>{(by[d.ts]??={})[d.part]=d;});
  const tss=Object.keys(by).map(Number).filter(t=>by[t].stats).sort((a,b)=>b-a);
  if(!tss.length) return; const S=by[tss[0]]; SNAP_TS=tss[0];
  STREAMS.forEach(c=>{const ov={};RAW["ov_"+c].forEach(d=>ov[d.id]=d.ov||{});
    D[c]=((S[c]||{}).items||[]).map(it=>{const o=ov[it.id];if(!o)return it;const x={...it};
      Object.entries(o).forEach(([path,e])=>{if(e&&(USERF.includes(path)||e.at>SNAP_TS))setPath(x,path,e.v);});return x;});});
  const st=S.stats.data||{};
  D.meta=[{id:"inviteStats",...(st.inviteStats||{})},{id:"hotelStats",...(st.hotelStats||{})},{id:"source",file:S.stats.file||"",label:S.stats.label||"",ts:SNAP_TS}];
}
function setOv(col,it,path,value){const c="ov_"+col;let cur=RAW[c].find(d=>d.id===it.id);const ov={...((cur&&cur.ov)||{}),[path]:{v:value,at:Date.now()}};
  if(cur){cur.ov=ov;}else{RAW[c]=[...RAW[c],{id:it.id,ov}];} rebuild(); render(); write(()=>db.doc(c+"/"+it.id).set({ov}));}
function save(col,it,path,value){ if(STREAMS.includes(col)) return setOv(col,it,path,value);
  const patch={}; setPath(patch,path,value); setPath(it,path,value); render(); write(()=>db.doc(col+"/"+it.id).update(patch)); }
let db=null, canWrite=true;

const TABS=[["overview","总览"],["agenda","议程"],["activities","活动"],["materials","物料准备"],["invites","邀请人员"],["meals","餐饮"],["hotel","住宿"],["media","宣传"]];
let tab=(location.hash||"").slice(1); if(!TABS.some(t=>t[0]===tab)) tab="overview";
const F={agenda:{date:"",venue:"",todo:false},materials:{area:"",prog:"",owner:"",block:false,hideDone:true},media:{type:"",open:true},tasks:{mine:false,late:false,hideDone:true,owner:"",sheet:""},invites:{kind:""}};

const STAGES={
 agenda:[["ppt","PPT初稿"],["redesign","PPT重设计"],["review","医学终审"],["caption","题卡/字幕"]],
 materials:[["content","内容确认"],["design","设计完成"],["proof","打样完成"],["made","制作完成"],["arrived","已到货"]],
 activities:[["script","台本定稿"],["staff","人员落名"],["material","物料齐备"],["rehearsal","已彩排"]],
 meals:[["count","人数确认"],["venue","场地确认"],["vendor","供餐方确认"],["menu","菜单确认"],["special","特殊餐食"]],
 hotel:[["list","名单确认"],["room","房型分配"],["pay","付费方式"],["hotel","酒店确认"]]
};

function noteHTML(col,it){return `<span class="note ${it.note?"":"empty"}" data-col="${col}" data-id="${it.id}" data-act="note" tabindex="0">${esc(it.note||"＋备注")}</span>`}
function stageDone(col,items){const ks=STAGES[col].map(s=>s[0]);let d=0,t=0;items.forEach(i=>ks.forEach(k=>{t++;if(i.st&&i.st[k])d++;}));return [d,t];}
function stageFunnel(col,items){

}
function dueHTML(d,done){if(!d||!/^\d{4}/.test(d))return esc(d||"");const n=daysTo(d);if(done)return md(d);return n<0?`<span class="late">${md(d)} 逾期${-n}天</span>`:n===0?`<span class="today">${md(d)} 今天</span>`:md(d);}
function kpi(label,big,sub,warn,bar){return `<div class="kpi ${warn?"warn":""}"><div class="eyebrow">${label}</div><div class="big">${big}</div>${bar||""}<div class="sub">${sub||""}</div></div>`}

function setTab(k){tab=k;try{history.replaceState(null,"","#"+k)}catch(_){}render();window.scrollTo({top:0});}

document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]"); if(tb){setTab(tb.dataset.tab);return;}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
let overlay={}; try{overlay=JSON.parse(localStorage.getItem(LOCAL)||"{}")||{}}catch(_){overlay={}}
function saveOverlay(){try{localStorage.setItem(LOCAL,JSON.stringify(overlay))}catch(_){showBanner("本机存储不可用，勾选和备注刷新后会丢失。")}}
function merge(a,b){const o={...a};for(const k in b){o[k]=(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a&&typeof a[k]==="object")?merge(a[k],b[k]):b[k];}return o;}
let BASE={};
function applyAll(){COLS.forEach(c=>{const ids=new Set();let arr=(BASE[c]||[]).map(d=>{ids.add(d.id);const p=overlay[c+"/"+d.id];if(!p)return d;if(p.__deleted)return null;if(p.__set)return {...p,id:d.id};return merge(d,p);}).filter(Boolean);
  Object.keys(overlay).filter(k=>k.startsWith(c+"/")&&!ids.has(k.slice(c.length+1))&&!overlay[k].__deleted).forEach(k=>arr.push({...overlay[k],id:k.slice(c.length+1)}));RAW[c]=arr;}); rebuild();}
const localDb={doc:p=>({set:async data=>{overlay[p]={...data,__set:true};saveOverlay();applyAll();sched();},update:async patch=>{overlay[p]=merge(overlay[p]||{},patch);saveOverlay();applyAll();sched();},delete:async()=>{overlay[p]={__deleted:true};saveOverlay();applyAll();sched();}}),
  collection:c=>({add:async d=>{const id="local-"+Date.now().toString(36);overlay[c+"/"+id]={...d,__set:true};saveOverlay();applyAll();sched();}})};
async function deriveKey(pw){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(BLOB.s),iterations:BLOB.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);}
async function decrypt(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(BLOB.i)},key,b64(BLOB.c));return JSON.parse(new TextDecoder().decode(pt));}
function start(data){ if(started)return; started=true; BASE=data; $("built").textContent=data._built||""; db=localDb; applyAll();
  $("gate").hidden=true; $("app").hidden=false; render(); qInit(); }
$("gateForm").addEventListener("submit",async e=>{e.preventDefault(); $("gateErr").textContent="正在解密…";
  const v=$("gatePw").value.trim().toUpperCase();
  let key,data; try{key=await deriveKey(v); data=await decrypt(key);}catch(err){ $("gateErr").textContent=(window.crypto&&crypto.subtle)?"密码不正确，请重试":"当前浏览器不支持解密，请用最新版 Chrome / Edge / Safari 打开"; $("gatePw").select(); return; }
  try{const raw=await crypto.subtle.exportKey("raw",key); localStorage.setItem(KEY,JSON.stringify({k:b64e(raw),s:BLOB.s,exp:Date.now()+7*864e5}));}catch(_){}
  start(data);});
$("lockBtn").addEventListener("click",()=>{try{localStorage.removeItem(KEY)}catch(_){} location.reload();});
$("clearLocal").addEventListener("click",e=>{const btn=e.currentTarget; if(!btn.dataset.confirm){btn.dataset.confirm="1";btn.textContent="再点一次确认清除";return;} overlay={}; saveOverlay(); applyAll(); render();});
(async function(){let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||"null")}catch(_){}
  if(saved&&saved.exp>Date.now()&&saved.s===BLOB.s){try{const key=await crypto.subtle.importKey("raw",b64(saved.k),{name:"AES-GCM"},false,["decrypt"]);start(await decrypt(key));return;}catch(_){}}
  $("gatePw").focus();})();
})();
